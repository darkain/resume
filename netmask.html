<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Mask</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }

  h1 {
    margin-bottom: 40px;
    font-size: 28px;
    letter-spacing: 4px;
    color: #00d4ff;
    text-transform: uppercase;
  }

  .mask-container {
    display: flex;
    gap: 24px;
    margin-bottom: 60px;
  }

  .group {
    display: flex;
    gap: 4px;
  }

  .bit {
    width: 52px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    border: 2px solid #333;
    border-radius: 6px;
    background: #16213e;
    color: #555;
    transition: all 0.2s ease;
  }

  .bit.active {
    background: #0f3460;
    border-color: #00d4ff;
    color: #00d4ff;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
  }

  .group-separator {
    width: 24px;
  }

  .slider-section {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .slider-label {
    font-size: 18px;
    color: #aaa;
    min-width: 120px;
    text-align: right;
  }

  .slider-value {
    font-size: 24px;
    color: #00d4ff;
    min-width: 60px;
    font-weight: bold;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 500px;
    height: 8px;
    background: #16213e;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    background: #00d4ff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }

  input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    background: #00d4ff;
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }

  .info {
    margin-top: 30px;
    font-size: 14px;
    color: #666;
    text-align: center;
  }

  .notation {
    margin-top: 16px;
    font-size: 20px;
    color: #ff9800;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Network Mask</h1>

<div class="mask-container" id="maskContainer"></div>

<div class="slider-section">
  <span class="slider-label" id="sliderLabel">Mask: /0</span>
  <input type="range" id="maskSlider" min="0" max="32" value="0">
  <span class="slider-value" id="sliderValue">/0</span>
</div>

<div class="info">Drag the slider to set the network mask length (0–32)</div>
<div class="notation" id="notation">255.255.255.255</div>

<script>
  const container = document.getElementById('maskContainer');
  const slider = document.getElementById('maskSlider');
  const label = document.getElementById('sliderLabel');
  const valueDisplay = document.getElementById('sliderValue');

  // Build 32 bits in groups of 8
  for (let g = 0; g < 4; g++) {
    const group = document.createElement('div');
    group.className = 'group';

    for (let b = 0; b < 8; b++) {
      const bit = document.createElement('div');
      bit.className = 'bit';
      bit.id = 'bit-' + (g * 8 + b);
      bit.textContent = '0';
      group.appendChild(bit);
    }

    container.appendChild(group);

    if (g < 3) {
      const sep = document.createElement('div');
      sep.className = 'group-separator';
      container.appendChild(sep);
    }
  }

  function updateMask(val) {
    for (let i = 0; i < 32; i++) {
      const bit = document.getElementById('bit-' + i);
      if (i < val) {
        bit.textContent = '1';
        bit.classList.add('active');
      } else {
        bit.textContent = '0';
        bit.classList.remove('active');
      }
    }
    label.textContent = 'Mask: /' + val;
    valueDisplay.textContent = '/' + val;

    // Calculate dotted decimal notation
    const octets = [];
    for (let o = 0; o < 4; o++) {
      let byteVal = 0;
      for (let b = 0; b < 8; b++) {
        const bitIndex = o * 8 + b;
        if (bitIndex < val) {
          byteVal |= (1 << (7 - b));
        }
      }
      octets.push(byteVal);
    }
    document.getElementById('notation').textContent = octets.join('.');
  }

  slider.addEventListener('input', function() {
    updateMask(parseInt(this.value));
  });

  // Initialize
  updateMask(0);
</script>

</body>
</html>
